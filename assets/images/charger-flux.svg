<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" width="100%" height="100%">
  <defs>
    <filter id="charger-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#111111" flood-opacity="0.22" />
    </filter>
    <linearGradient id="charger-case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32343A" />
      <stop offset="60%" stop-color="#202227" />
      <stop offset="100%" stop-color="#151619" />
    </linearGradient>
    <linearGradient id="yellow-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#E5C714" />
    </linearGradient>
  </defs>

  <g transform="translate(300, 300) rotate(-6) translate(-300, -300)" filter="url(#charger-shadow)">
    <!-- GaN Fast Charger Isometric Block Body -->
    <rect x="180" y="140" width="240" height="320" rx="28" fill="url(#charger-case)" stroke="#4A4E5A" stroke-width="2.5" />
    
    <!-- Top Face Accent Strip (Soft Yellow GaN branding) -->
    <rect x="204" y="164" width="192" height="6" rx="3" fill="url(#yellow-accent)" />

    <!-- Port Panel Inset -->
    <rect x="204" y="195" width="192" height="215" rx="16" fill="#141518" stroke="#0C0D0E" stroke-width="2" />

    <!-- USB-C Port 1 (100W Max) -->
    <g transform="translate(230, 220)">
      <rect x="0" y="0" width="140" height="42" rx="10" fill="#202227" stroke="#363942" stroke-width="1.5" />
      <rect x="42" y="13" width="56" height="16" rx="8" fill="#0E0F11" stroke="#FFD700" stroke-width="1.5" />
      <text x="15" y="26" fill="#FFF066" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11">C1</text>
      <text x="125" y="26" fill="#8E93A0" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9" text-anchor="end">100W</text>
    </g>

    <!-- USB-C Port 2 (65W) -->
    <g transform="translate(230, 280)">
      <rect x="0" y="0" width="140" height="42" rx="10" fill="#202227" stroke="#363942" stroke-width="1.5" />
      <rect x="42" y="13" width="56" height="16" rx="8" fill="#0E0F11" stroke="#FFF066" stroke-width="1.5" />
      <text x="15" y="26" fill="#FFF066" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11">C2</text>
      <text x="125" y="26" fill="#8E93A0" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9" text-anchor="end">65W</text>
    </g>

    <!-- USB-A Legacy / Fast Port (22.5W) -->
    <g transform="translate(230, 340)">
      <rect x="0" y="0" width="140" height="42" rx="10" fill="#202227" stroke="#363942" stroke-width="1.5" />
      <rect x="36" y="12" width="68" height="18" rx="4" fill="#0E0F11" stroke="#5D7CFF" stroke-width="1.5" />
      <text x="15" y="26" fill="#5D7CFF" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11">A1</text>
      <text x="125" y="26" fill="#8E93A0" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9" text-anchor="end">22.5W</text>
    </g>

    <!-- Subtle Technical Typography at base -->
    <text x="300" y="438" fill="#8E93A0" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" letter-spacing="3" text-anchor="middle">FLUX // GaN III 100W</text>
  </g>
</svg>
