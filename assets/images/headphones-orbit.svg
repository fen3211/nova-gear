<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" width="100%" height="100%">
  <defs>
    <filter id="headphone-shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#111111" flood-opacity="0.25" />
    </filter>
    <linearGradient id="band-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40434C" />
      <stop offset="50%" stop-color="#282A30" />
      <stop offset="100%" stop-color="#40434C" />
    </linearGradient>
    <linearGradient id="cup-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2C33" />
      <stop offset="100%" stop-color="#141518" />
    </linearGradient>
    <linearGradient id="orange-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D" />
      <stop offset="100%" stop-color="#E54E0B" />
    </linearGradient>
  </defs>

  <g transform="translate(300, 300) rotate(5) translate(-300, -300)" filter="url(#headphone-shadow)">
    <!-- Stainless Steel Spring Band Outer Arc -->
    <path d="M150 330 C 140 160, 460 160, 450 330" fill="none" stroke="url(#band-metal)" stroke-width="16" stroke-linecap="round" />
    <!-- Cushioned Headband Inner Sleeve -->
    <path d="M185 240 C 220 180, 380 180, 415 240" fill="none" stroke="#1D1E22" stroke-width="26" stroke-linecap="round" />
    <path d="M190 238 C 225 184, 375 184, 410 238" fill="none" stroke="#2D3038" stroke-width="2" stroke-linecap="round" />

    <!-- Left Gimbal & Yoke Pivot -->
    <g transform="translate(142, 330)">
      <rect x="-14" y="0" width="28" height="40" rx="8" fill="#3D404A" stroke="#555966" stroke-width="1.5" />
      <circle cx="0" cy="20" r="6" fill="#FF7A3D" />
    </g>

    <!-- Right Gimbal & Yoke Pivot -->
    <g transform="translate(458, 330)">
      <rect x="-14" y="0" width="28" height="40" rx="8" fill="#3D404A" stroke="#555966" stroke-width="1.5" />
      <circle cx="0" cy="20" r="6" fill="#FF7A3D" />
    </g>

    <!-- Left Ear Cup Assembly (Angled) -->
    <g transform="translate(130, 390) rotate(10)">
      <!-- Plush Cushion Underlayer -->
      <ellipse cx="0" cy="0" rx="60" ry="85" fill="#18191D" stroke="#0C0D0E" stroke-width="3" />
      <!-- Outer Acoustic Capsule -->
      <ellipse cx="14" cy="0" rx="48" ry="74" fill="url(#cup-dark)" stroke="#3E424D" stroke-width="2" />
      <!-- Radial CNC Ring Accent (Warm Orange) -->
      <circle cx="20" cy="0" r="28" fill="none" stroke="url(#orange-accent)" stroke-width="2.5" />
      <!-- ANC Microphone Pinholes -->
      <circle cx="16" cy="-45" r="2" fill="#5D7CFF" />
      <circle cx="24" cy="-45" r="2" fill="#5D7CFF" />
    </g>

    <!-- Right Ear Cup Assembly (Angled) -->
    <g transform="translate(470, 390) rotate(-10)">
      <!-- Plush Cushion Underlayer -->
      <ellipse cx="0" cy="0" rx="60" ry="85" fill="#18191D" stroke="#0C0D0E" stroke-width="3" />
      <!-- Outer Acoustic Capsule -->
      <ellipse cx="-14" cy="0" rx="48" ry="74" fill="url(#cup-dark)" stroke="#3E424D" stroke-width="2" />
      <!-- Radial CNC Ring Accent (Warm Orange) -->
      <circle cx="-20" cy="0" r="28" fill="none" stroke="url(#orange-accent)" stroke-width="2.5" />
      <!-- ANC Microphone Pinholes -->
      <circle cx="-16" cy="-45" r="2" fill="#5D7CFF" />
      <circle cx="-24" cy="-45" r="2" fill="#5D7CFF" />
    </g>

    <!-- Center Spec / Brand Badge -->
    <text x="300" y="470" fill="#999EAA" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" letter-spacing="4" text-anchor="middle">ORBIT // 48HR ANC</text>
  </g>
</svg>
