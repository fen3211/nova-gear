<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" width="100%" height="100%">
  <defs>
    <filter id="beam-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#111111" flood-opacity="0.25" />
    </filter>
    <linearGradient id="bar-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C3F48" />
      <stop offset="50%" stop-color="#24262C" />
      <stop offset="100%" stop-color="#16171B" />
    </linearGradient>
    <linearGradient id="light-cast" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FFEAA7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFF5B8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rgb-back" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C7FF3D" />
      <stop offset="50%" stop-color="#5D7CFF" />
      <stop offset="100%" stop-color="#FF5353" />
    </linearGradient>
  </defs>

  <g transform="translate(300, 300) rotate(-4) translate(-300, -300)" filter="url(#beam-shadow)">
    <!-- Asymmetric Light Glow Projected Downwards -->
    <polygon points="120,245 480,245 540,430 60,430" fill="url(#light-cast)" />

    <!-- Counterweight Monitor Hanging Mount Bracket -->
    <path d="M280 180 C 280 160, 320 160, 320 180 L 320 230 L 280 230 Z" fill="#18191D" stroke="#363942" stroke-width="2" />
    <circle cx="300" cy="180" r="16" fill="#2A2C34" stroke="#484D5C" stroke-width="2" />
    <circle cx="300" cy="180" r="6" fill="#C7FF3D" />

    <!-- Ambient Backlight Strip (Subtle RGB halo on top) -->
    <rect x="130" y="215" width="340" height="4" rx="2" fill="url(#rgb-back)" />

    <!-- Main CNC Aluminum Cylindrical Bar Tube -->
    <rect x="70" y="222" width="460" height="24" rx="12" fill="url(#bar-metal)" stroke="#4A4E5C" stroke-width="2" />
    
    <!-- Touch Control Endcaps -->
    <circle cx="82" cy="234" r="9" fill="#111113" stroke="#C7FF3D" stroke-width="2" />
    <circle cx="518" cy="234" r="9" fill="#111113" stroke="#5D7CFF" stroke-width="2" />

    <!-- Diffuser Lens Slit (Warm Illumination source) -->
    <rect x="100" y="240" width="400" height="4" rx="2" fill="#FFF5B8" />

    <!-- Minimalist Typography / Calibration Marks -->
    <text x="300" y="300" fill="#787E8E" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" letter-spacing="3" text-anchor="middle">BEAM // CRI 97 DUAL-SOURCE</text>
  </g>
</svg>
