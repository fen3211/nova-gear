<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" width="100%" height="100%">
  <defs>
    <filter id="mouse-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#111111" flood-opacity="0.25" />
    </filter>
    <linearGradient id="mouse-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3038" />
      <stop offset="50%" stop-color="#1F2126" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>
    <linearGradient id="wheel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C7FF3D" />
      <stop offset="100%" stop-color="#9AD810" />
    </linearGradient>
    <linearGradient id="glow-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D7CFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#5D7CFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g transform="translate(300, 300) rotate(-8) translate(-300, -300)" filter="url(#mouse-shadow)">
    <!-- Ergonomic Base Outline with thumb flare -->
    <path d="M210 160 C 230 110, 370 110, 390 160 C 420 230, 435 340, 395 440 C 365 500, 235 500, 205 440 C 165 350, 180 230, 210 160 Z"
          fill="url(#mouse-body)" stroke="#4A4E5A" stroke-width="2.5" />

    <!-- Left Thumb Rest Wing -->
    <path d="M195 280 C 160 320, 155 380, 185 425 C 195 438, 208 448, 220 452 C 205 400, 200 340, 195 280 Z"
          fill="#17181C" stroke="#363942" stroke-width="2" />
    
    <!-- Thumb Macro Buttons -->
    <rect x="172" y="325" width="16" height="34" rx="5" fill="#5D7CFF" />
    <rect x="175" y="367" width="14" height="30" rx="5" fill="#3B3E48" />

    <!-- Primary Button Split Seam -->
    <path d="M300 125 L300 270" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    
    <!-- Scroll Wheel Well -->
    <rect x="282" y="160" width="36" height="84" rx="14" fill="#0E0F12" stroke="#25272E" stroke-width="2" />
    <!-- Tactical Knurled Scroll Wheel (Acid Green accent) -->
    <rect x="288" y="170" width="24" height="64" rx="8" fill="url(#wheel-grad)" />
    <!-- Grip Ribs on Wheel -->
    <line x1="288" y1="182" x2="312" y2="182" stroke="#111111" stroke-width="2" />
    <line x1="288" y1="194" x2="312" y2="194" stroke="#111111" stroke-width="2" />
    <line x1="288" y1="206" x2="312" y2="206" stroke="#111111" stroke-width="2" />
    <line x1="288" y1="218" x2="312" y2="218" stroke="#111111" stroke-width="2" />

    <!-- DPI Toggle Switch -->
    <rect x="291" y="258" width="18" height="24" rx="4" fill="#3B3E48" stroke="#5D7CFF" stroke-width="1.5" />

    <!-- Palm Arch Contour Line -->
    <path d="M225 330 C 260 300, 340 300, 375 330" stroke="#3B3F4A" stroke-width="2" fill="none" opacity="0.6" />
    
    <!-- Subtle LED Optical Arc / Sensor Accent -->
    <path d="M245 425 C 280 445, 320 445, 355 425" stroke="#5D7CFF" stroke-width="3" fill="none" stroke-linecap="round" />
    
    <!-- Wordmark / Spec Tag -->
    <text x="300" y="405" fill="#8E93A0" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" letter-spacing="3" text-anchor="middle">PULSE // 8KHz</text>
  </g>
</svg>
